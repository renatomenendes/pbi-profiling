name: Bug report
description: Report a reproducible defect using synthetic or non-sensitive evidence.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload corporate PBIX/PBIP files, credentials, internal paths or confidential screenshots.

  - type: input
    id: version
    attributes:
      label: Version
      description: Release version or commit SHA.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: input
    attributes:
      label: Input type
      options:
        - PBIP
        - PBIX open workflow
        - CLI
        - Local UI
        - Packaging / release
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data or an openly shareable fixture.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private paths, tokens and corporate identifiers before posting.
