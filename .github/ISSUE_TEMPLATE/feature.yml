name: Feature request
description: Propose a capability or contract change.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user or engineering problem should be solved?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result, not an implementation preference.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and invariants
      description: What existing behavior must remain unchanged?
