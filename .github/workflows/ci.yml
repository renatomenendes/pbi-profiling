name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify pinned upstream
        run: test "$(git -C vendor/pbi-lineage-lenz rev-parse HEAD)" = "7e2c61cac2f5e0ca6e7135df17a6918c89c42aec"

      - name: Verify zero-install contract
        run: |
          test ! -d node_modules
          node -e "const p=require('./package.json'); if (p.dependencies || p.devDependencies) process.exit(1)"

      - name: Syntax validation
        run: node ./scripts/check.js

      - name: Test suite
        run: node ./scripts/test.js

      - name: CLI smoke test
        run: node ./src/cli.js --help

  powershell-contract:
    name: Windows PowerShell 5.1 contract
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse Windows PBIX launcher with Windows PowerShell
        shell: powershell
        run: |
          $script = '.\scripts\windows\open-pbix.ps1'
          $tokens = $null
          $errors = $null

          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error "${script}: $($_.Message)"
            }
            exit 1
          }

          Write-Host "Windows PowerShell syntax OK: $script"
