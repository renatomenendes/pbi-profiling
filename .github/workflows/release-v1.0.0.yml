name: Release v1.0.0

on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: write

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout approved main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release version
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.0"

      - name: Run release quality gates
        run: |
          node ./scripts/check.js
          node ./scripts/test.js
          node ./src/cli.js --help

      - name: Verify pinned upstream
        run: |
          test "$(git -C vendor/pbi-lineage-lenz rev-parse HEAD)" = "7e2c61cac2f5e0ca6e7135df17a6918c89c42aec"

      - name: Build portable package
        run: node ./scripts/package-release.js 1.0.0

      - name: Create synthetic PBIP
        env:
          FIXTURE_DIR: ${{ runner.temp }}/release-fixture
        run: |
          node --input-type=module -e "import { writePbipFixture } from './test/fixtures/pbip.js'; writePbipFixture(process.env.FIXTURE_DIR);"

      - name: Smoke test staged runtime
        env:
          FIXTURE_DIR: ${{ runner.temp }}/release-fixture
          OUTPUT_DIR: ${{ runner.temp }}/staged-output
        run: |
          PACKAGE_DIR="dist/pbi-profiling-v1.0.0-windows-portable"

          node "${PACKAGE_DIR}/src/cli.js" profile "${FIXTURE_DIR}" --output "${OUTPUT_DIR}"

          test -s "${OUTPUT_DIR}/profile.html"
          test -s "${OUTPUT_DIR}/profile.json"
          test -s "${OUTPUT_DIR}/profile.rag.jsonl"

      - name: Create deterministic ZIP and checksum
        run: |
          PACKAGE_BASENAME="pbi-profiling-v1.0.0-windows-portable"
          PACKAGE_DIR="dist/${PACKAGE_BASENAME}"
          ASSET="${PACKAGE_BASENAME}.zip"

          mkdir -p release

          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          find "${PACKAGE_DIR}" -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +

          (
            cd dist
            find "${PACKAGE_BASENAME}" -type f -print |
              LC_ALL=C sort |
              zip -X -q "../release/${ASSET}" -@
          )

          sha256sum "release/${ASSET}" > release/SHA256SUMS.txt

      - name: Smoke test ZIP artifact
        env:
          FIXTURE_DIR: ${{ runner.temp }}/release-fixture
          OUTPUT_DIR: ${{ runner.temp }}/zip-output
        run: |
          mkdir -p "${RUNNER_TEMP}/release-unpacked"
          unzip -q             release/pbi-profiling-v1.0.0-windows-portable.zip             -d "${RUNNER_TEMP}/release-unpacked"

          PACKAGE_DIR="${RUNNER_TEMP}/release-unpacked/pbi-profiling-v1.0.0-windows-portable"

          node "${PACKAGE_DIR}/src/cli.js" profile "${FIXTURE_DIR}" --output "${OUTPUT_DIR}"

          test -s "${OUTPUT_DIR}/profile.html"
          test -s "${OUTPUT_DIR}/profile.json"
          test -s "${OUTPUT_DIR}/profile.rag.jsonl"

          if find "${PACKAGE_DIR}" -name .git -o -name node_modules -o -name coverage | grep -q .; then
            echo "Forbidden development content found in final ZIP."
            exit 1
          fi

      - name: Upload audited release assets
        uses: actions/upload-artifact@v4
        with:
          name: pbi-profiling-v1.0.0-release-assets
          path: |
            release/pbi-profiling-v1.0.0-windows-portable.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create immutable release tag
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "Tag v1.0.0 already exists; refusing to overwrite it."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a v1.0.0 "$(git rev-parse HEAD)" -m "pbi-profiling v1.0.0"
          git push origin v1.0.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0             release/pbi-profiling-v1.0.0-windows-portable.zip             release/SHA256SUMS.txt             --repo "${GITHUB_REPOSITORY}"             --title "pbi-profiling v1.0.0"             --notes-file docs/releases/v1.0.0.md             --verify-tag
